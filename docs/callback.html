<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kombi Kontrol</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#0f172a;color:#fff">
<h2>Giriş tamamlandı</h2>
<a id="go" href="#" style="display:block;background:#f97316;color:#fff;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold">Uygulamaya dön</a>
<script>
var q=location.search;
var t="intent://oauth/callback"+q+"#Intent;scheme=kombikontrol;package=com.kombikontrol.app;end";
document.getElementById("go").href=t;
if(q.indexOf("code=")>-1) setTimeout(function(){location.href=t},400);
</script></body></html>
